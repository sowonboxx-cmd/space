/* ---------- Search ---------- */
// Browsers' password managers like to drop the saved login into the first
// text field they find. The field stays read-only until it is actually used,
// and anything the browser slips in on its own is wiped.
const searchEl = $('#searchInput');
const unlockSearch = () => searchEl.removeAttribute('readonly');
searchEl.addEventListener('pointerdown', unlockSearch);
searchEl.addEventListener('focus', unlockSearch);
searchEl.addEventListener('touchstart', unlockSearch, { passive: true });
let userTyped = false;
searchEl.addEventListener('keydown', () => { userTyped = true; });
searchEl.addEventListener('paste', () => { userTyped = true; });
[300, 800, 1600, 3000].forEach(ms => setTimeout(() => {
  if(!userTyped && searchEl.value !== STATE.search){ searchEl.value = STATE.search; }
}, ms));
$('#searchInput').addEventListener('input', (e) => {
  if(!userTyped && e.target.value && e.target.value.includes('@') && !STATE.search){ e.target.value = ''; return; }
  STATE.search = e.target.value;
  if(STATE.search && STATE.section === 'links' && STATE.mobileView === 'folders' && isMobile()){
    STATE.mobileView = 'links'; STATE.nav = 'all'; STATE.folder = ''; STATE.sub = '';
  }
  render();
});
$('#searchClear').onclick = (e) => { e.preventDefault(); STATE.search = ''; render(); $('#searchInput').focus(); };
document.addEventListener('keydown', (e) => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); unlockSearch(); $('#searchInput').focus(); $('#searchInput').select(); }
  if(e.key === 'Escape'){
    const open = $$('.overlay.show');
    if(open.length){ open.forEach(o => o.classList.remove('show')); return; }
    if(document.activeElement === $('#searchInput') && STATE.search){ STATE.search = ''; render(); }
  }
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    if($('#linkOverlay').classList.contains('show')) $('#saveLinkBtn').click();
    else if($('#accountOverlay').classList.contains('show')) $('#saveAccountBtn').click();
  }
});

/* ---------- Drag & drop (desktop, date order only) ---------- */
function reorderLink(draggedId, targetId, insertAfter){
  const order = lastGridOrder.slice();
  const fromIdx = order.indexOf(draggedId);
  if(fromIdx === -1) return;
  order.splice(fromIdx, 1);
  let toIdx = order.indexOf(targetId);
  if(toIdx === -1) order.push(draggedId);
  else { if(insertAfter) toIdx += 1; order.splice(toIdx, 0, draggedId); }
  // Keep the reordered cards above everything not currently displayed.
  const top = Math.max(Date.now(), ...STATE.links.map(l => l.sortOrder || 0));
  const n = order.length;
  order.forEach((id, i) => { const l = STATE.links.find(x => x.id === id); if(l) l.sortOrder = top + (n - i); });
}
let dragSourceId = null;
$('#gridView').addEventListener('dragstart', (e) => {
  const head = e.target.closest && e.target.closest('.card-head');
  if(!head || STATE.sort !== 'date' || isMobile()){ e.preventDefault(); return; }
  const card = head.closest('.card');
  dragSourceId = card.dataset.id;
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSourceId);
});
$('#gridView').addEventListener('dragend', () => {
  $$('.card').forEach(c => c.classList.remove('dragging', 'drag-over'));
  dragSourceId = null;
});
$('#gridView').addEventListener('dragover', (e) => {
  if(!dragSourceId) return;
  e.preventDefault();
  const card = e.target.closest('.card');
  if(!card || card.dataset.id === dragSourceId) return;
  $$('.card').forEach(c => c.classList.remove('drag-over'));
  card.classList.add('drag-over');
});
$('#gridView').addEventListener('drop', (e) => {
  e.preventDefault();
  const card = e.target.closest('.card');
  if(!card || !dragSourceId || card.dataset.id === dragSourceId) return;
  const rect = card.getBoundingClientRect();
  reorderLink(dragSourceId, card.dataset.id, (e.clientX - rect.left) > rect.width / 2);
  dragSourceId = null;
  lastGridOrder = []; // order changed: rebuild
  render();
  saveToGitHub();
});

function renderFolderPicker(){
  const tree = buildTree();
  const names = Array.from(new Set([...tree.map(f => f.name), ...STATE.modalFolders])).sort((a, b) => a.localeCompare(b, 'fr'));
  $('#folderPicker').innerHTML = names.map(n =>
    `<button type="button" class="choice${STATE.modalFolders.includes(n) ? ' on' : ''}" data-pick-folder="${escapeHtml(n)}">${escapeHtml(n)}</button>`
  ).join('') + `<button type="button" class="choice add" data-new-folder="1">+ Nouveau dossier</button>`;

  $('#subBoxes').innerHTML = STATE.modalFolders.map(f => {
    const node = tree.find(x => x.name === f);

    const picked = STATE.modalSubs.filter(k => catParts(k).folder === f).map(k => catParts(k).sub);
    const subs = Array.from(new Set([...existing, ...picked])).sort((a, b) => a.localeCompare(b, 'fr'));
    return `<div class="sub-box show">
      <span class="field-label">Sous-catégories de ${escapeHtml(f)}</span>
      <div class="choice-row">${subs.map(s => {
        const on = picked.includes(s);
        return `<button type="button" class="choice${on ? ' on' : ''}" data-pick-sub="${escapeHtml(catKey(f, s))}">${on ? SVG.check.replace('class="chk" ', '') : ''}${escapeHtml(s)}</button>`;

    const f = pf.dataset.pickFolder;
    if(STATE.modalFolders.includes(f)){
      STATE.modalFolders = STATE.modalFolders.filter(x => x !== f);
      STATE.modalSubs = STATE.modalSubs.filter(k => catParts(k).folder !== f);
    } else STATE.modalFolders.push(f);
    renderFolderPicker();
    return;
  }
  const ps = e.target.closest('[data-pick-sub]');
  if(ps){
    const k = ps.dataset.pickSub;
    STATE.modalSubs = STATE.modalSubs.includes(k) ? STATE.modalSubs.filter(x => x !== k) : [...STATE.modalSubs, k];
    renderFolderPicker();
    return;
  }
  if(e.target.closest('[data-new-folder]')){
    const name = (prompt('Nom du nouveau dossier :') || '').trim();
    if(name && !name.includes(' - ')){
      if(!STATE.modalFolders.includes(name)) STATE.modalFolders.push(name);
      renderFolderPicker();
    }
    return;
  }
  const ns = e.target.closest('[data-new-sub]');
  if(ns){
    const f = ns.dataset.newSub;
    const name = (prompt(`Nouvelle sous-catégorie dans ${f} :`) || '').trim();
    if(name && !name.includes(' - ')){
      const k = catKey(f, name);
      if(!STATE.modalSubs.includes(k)) STATE.modalSubs.push(k);
      renderFolderPicker();
    }
  }
});

function modalCategories(){

function updateDetected(){
  const url = $('#linkUrl').value.trim();
  if(!url){ $('#detectedPlat').textContent = ''; $('#linkSourceField').style.display = 'none'; $('#linkPreview').textContent = "L'aperçu s'affichera ici"; return; }
  const p = detectPlatform(url);
  $('#detectedPlat').textContent = platformLabel(p) + ' détecté' + (p === 'instagram' && /[?#]/.test(url) ? ', lien nettoyé' : '');
  $('#linkSourceField').style.display = p === 'other' ? 'flex' : 'none';
  $('#linkPreview').classList.remove('has-embed');
  $('#linkPreview').textContent = 'Entrée pour voir l\'aperçu';
}
// Show the real post in the add sheet: Instagram's own embed, or the video
// itself for a self-hosted file. Other platforms keep a short note, since
// their preview goes through the Worker and only exists once saved.
function showLinkPreview(){
  const url = $('#linkUrl').value.trim();
  const box = $('#linkPreview');
  if(!url) return;
  const platform = detectPlatform(url);
  const temp = { id: '__preview', url, platform };
  if(platform === 'instagram' || (platform === 'other' && isDirectVideoUrl(url))){
    box.classList.add('has-embed');
    box.innerHTML = buildEmbedHTML(temp);
    if(platform === 'instagram') reprocessEmbeds([temp]);
  } else {
    box.classList.remove('has-embed');
    box.textContent = `Aperçu ${platformLabel(platform)} affiché sur la carte après l'ajout`;
  }
}
$('#linkUrl').addEventListener('input', updateDetected);
$('#linkUrl').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.metaKey && !e.ctrlKey){ e.preventDefault(); showLinkPreview(); }
});
$('#linkUrl').addEventListener('paste', () => setTimeout(() => { updateDetected(); showLinkPreview(); }, 0));
$('#pasteBtn').onclick = async () => {
  try{
    const txt = (await navigator.clipboard.readText() || '').trim();
    if(txt){ $('#linkUrl').value = txt; updateDetected(); showLinkPreview(); }
  } catch(err){ $('#linkUrl').focus(); toast('Collez le lien dans le champ'); }
};

$('#promptHeader').onclick = () => {
  const open = !$('#promptBody').classList.contains('show');
  $('#promptBody').classList.toggle('show', open);
  $('#promptHeader').classList.toggle('open', open);
  $('#promptHeader').setAttribute('aria-expanded', open ? 'true' : 'false');
};
$('#copyPromptBtn').onclick = async () => {
  const text = $('#linkPrompt').value;
  if(!text){ toast('Rien à copier'); return; }
  try{ await navigator.clipboard.writeText(text); toast('Prompt copié'); }
  catch(err){ toast('Impossible de copier'); }
};

function resetLinkModal(){
  STATE.editingId = null;
  $('#linkUrl').value = '';
  $('#linkSource').value = '';
  $('#linkNote').value = '';
  $('#linkLikes').value = '';
  $('#linkPostedAt').value = '';
  $('#linkPrompt').value = '';
  $('#promptBody').classList.remove('show');
  $('#promptHeader').classList.remove('open');
  STATE.modalFolders = STATE.folder ? [STATE.folder] : [];
  STATE.modalSubs = STATE.folder && STATE.sub ? [catKey(STATE.folder, STATE.sub)] : [];
  setFavPick(STATE.nav === 'fav');
  setPriorityPick('moyenne');
  renderFolderPicker();
  updateDetected();
  $('#linkModalTitle').textContent = 'Ajouter un lien';
  $('#saveLinkBtn').textContent = 'Ajouter';
  $('#deleteLinkBtn').style.display = 'none';
}

function openEditModal(id){
  const l = STATE.links.find(x => x.id === id);
  if(!l) return;
  resetLinkModal();
  STATE.editingId = id;
  $('#linkUrl').value = l.url;
  $('#linkSource').value = l.source || '';
  $('#linkNote').value = l.note || '';
  $('#linkLikes').value = Number.isFinite(l.likes) ? fmtInt(l.likes) : '';
  $('#linkPostedAt').value = l.postedAt ? String(l.postedAt).slice(0, 10) : '';
  $('#linkPrompt').value = l.prompt || '';
  const parts = (l.categories || []).map(catParts).filter(p => p.folder);
  STATE.modalFolders = Array.from(new Set(parts.map(p => p.folder)));
  STATE.modalSubs = Array.from(new Set(parts.filter(p => p.sub).map(p => catKey(p.folder, p.sub))));
  setFavPick(!!l.fav);
  setPriorityPick(l.priority || 'aucune');
  renderFolderPicker();
  updateDetected();
  showLinkPreview();
  $('#linkModalTitle').textContent = 'Modifier le lien';
  $('#saveLinkBtn').textContent = 'Enregistrer';
  $('#deleteLinkBtn').style.display = 'inline-flex';
  openOverlay('#linkOverlay');
}

$('#closeLinkBtn').onclick = () => closeOverlay('#linkOverlay');
$('#cancelLinkBtn').onclick = () => closeOverlay('#linkOverlay');

$('#saveLinkBtn').onclick = () => {
  const url = $('#linkUrl').value.trim();
  if(!url){ toast("Collez un lien avant d'enregistrer"); return; }
  const platform = detectPlatform(url);
  const data = {
    url, platform,
    categories: modalCategories(),
    priority: ($('#priorityPicker .sel') || {}).dataset ? $('#priorityPicker .sel').dataset.p : 'aucune',
    note: $('#linkNote').value.trim(),
    prompt: $('#linkPrompt').value,
    source: platform === 'other' ? $('#linkSource').value.trim() : '',
    fav: STATE.modalFav
  };
  const likesRaw = $('#linkLikes').value.replace(/[^0-9]/g, '');
  const prev = STATE.editingId ? (STATE.links.find(x => x.id === STATE.editingId) || {}) : {};
  if(likesRaw){
    data.likes = parseInt(likesRaw, 10);
    data.likesAt = (prev.likes === data.likes && prev.likesAt) ? prev.likesAt : new Date().toISOString();
  } else { data.likes = undefined; data.likesAt = undefined; }
  data.postedAt = $('#linkPostedAt').value || undefined;
  if(STATE.editingId){
    const l = STATE.links.find(x => x.id === STATE.editingId);
    if(l) Object.assign(l, data);
  } else {
    STATE.links.push({ id: uid(), account: '', addedAt: new Date().toISOString(), ...data });
  }
  closeOverlay('#linkOverlay');
  render();
  saveToGitHub();
};

$('#deleteLinkBtn').onclick = () => {
  if(!STATE.editingId || !confirm('Supprimer ce lien ?')) return;
  STATE.links = STATE.links.filter(l => l.id !== STATE.editingId);
  closeOverlay('#linkOverlay');
  render();
  saveToGitHub();
};

/* ---------- Account modal ---------- */
function setQualityPick(q){ $$('#accountQualityPicker button').forEach(b => b.classList.toggle('sel', b.dataset.q === q)); }
$('#accountQualityPicker').addEventListener('click', (e) => { const b = e.target.closest('button'); if(b) setQualityPick(b.dataset.q); });

function renderAccountCatPicker(){
  const names = Array.from(new Set([...allAccountCategories(), ...STATE.accountModalCategories])).sort((a, b) => a.localeCompare(b, 'fr'));
  $('#accountCatPicker').innerHTML = names.map(n =>
    `<button type="button" class="choice${STATE.accountModalCategories.includes(n) ? ' on' : ''}" data-pick-acc-cat="${escapeHtml(n)}">${escapeHtml(n)}</button>`
  ).join('') + `<button type="button" class="choice add" data-new-acc-cat="1">+ Nouvelle</button>`;
}
$('#accountCatPicker').addEventListener('click', (e) => {
  const p = e.target.closest('[data-pick-acc-cat]');
  if(p){
    const c = p.dataset.pickAccCat;
    STATE.accountModalCategories = STATE.accountModalCategories.includes(c) ? STATE.accountModalCategories.filter(x => x !== c) : [...STATE.accountModalCategories, c];
    renderAccountCatPicker();
    return;
  }
  if(e.target.closest('[data-new-acc-cat]')){
    const name = (prompt('Nouvelle catégorie de compte :') || '').trim();
    if(name && !STATE.accountModalCategories.includes(name)){ STATE.accountModalCategories.push(name); renderAccountCatPicker(); }
  }
});

function resetAccountModal(){
  STATE.editingAccountId = null;
  $('#accountUrl').value = '';
  $('#accountName').value = '';
  $('#accountNote').value = '';
  STATE.accountModalCategories = STATE.accountCategoryFilter ? [STATE.accountCategoryFilter] : [];
  renderAccountCatPicker();
  setQualityPick(STATE.accountQualityFilter || 'high');
  $('#accountModalTitle').textContent = 'Ajouter un compte';
  $('#saveAccountBtn').textContent = 'Ajouter';
  $('#deleteAccountBtn').style.display = 'none';
}
$('#accountUrl').addEventListener('input', () => {
  const guess = extractAccountName($('#accountUrl').value.trim());
  if(guess && !$('#accountName').value.trim()) $('#accountName').value = guess;
});
function openEditAccountModal(id){
  const a = STATE.accounts.find(x => x.id === id);
  if(!a) return;
  resetAccountModal();
  STATE.editingAccountId = id;
  $('#accountUrl').value = a.url || '';
  $('#accountName').value = a.name || '';
  $('#accountNote').value = a.note || '';
  STATE.accountModalCategories = (a.categories || []).slice();
  renderAccountCatPicker();
  setQualityPick(a.quality || 'high');
  $('#accountModalTitle').textContent = 'Modifier le compte';
  $('#saveAccountBtn').textContent = 'Enregistrer';
  $('#deleteAccountBtn').style.display = 'inline-flex';
  openOverlay('#accountOverlay');
}
$('#closeAccountBtn').onclick = () => closeOverlay('#accountOverlay');
$('#cancelAccountBtn').onclick = () => closeOverlay('#accountOverlay');
$('#saveAccountBtn').onclick = () => {
  const url = $('#accountUrl').value.trim();
  if(!url){ toast("Collez un lien avant d'enregistrer"); return; }
  const data = {
    url,
    name: $('#accountName').value.trim() || extractAccountName(url) || '',
    categories: STATE.accountModalCategories.slice(),
    quality: ($('#accountQualityPicker .sel') || { dataset: { q: 'high' } }).dataset.q,
    note: $('#accountNote').value.trim()
  };
  if(STATE.editingAccountId){
    const a = STATE.accounts.find(x => x.id === STATE.editingAccountId);
    if(a) Object.assign(a, data);
  } else {
    STATE.accounts.push({ id: uid(), addedAt: new Date().toISOString(), ...data });
  }
  closeOverlay('#accountOverlay');
  render();
  saveToGitHub();
};
$('#deleteAccountBtn').onclick = () => {
  if(!STATE.editingAccountId || !confirm('Supprimer ce compte ?')) return;
  STATE.accounts = STATE.accounts.filter(a => a.id !== STATE.editingAccountId);
  closeOverlay('#accountOverlay');
  render();
  saveToGitHub();
};

/* ---------- Filter sheet (mobile) ---------- */
function renderFilterSheet(){
  const scope = filteredLinks({ ignorePriority: true });
  const count = p => scope.filter(l => (l.priority || 'aucune') === p).length;
  const tree = buildTree();
  const node = STATE.folder ? tree.find(f => f.name === STATE.folder) : null;
  $('#filterBody').innerHTML = `
    <div class="field">
      <span class="field-label">Priorité</span>
      <div class="filter-prio">${PRIOS.map(p => `<button type="button" class="p-${p}${STATE.priorityFilter === p ? ' active' : ''}" data-f-prio="${p}">${SVG.check}${capitalize(p)}<span class="count">${count(p)}</span></button>`).join('')}</div>
      <button type="button" class="toggle-row${STATE.nav === 'fav' ? ' on' : ''}" data-f-fav="1">${SVG.favNav}Favoris uniquement<span class="switch"></span></button>
    </div>
    <div class="field">
      <span class="field-label">Trier et afficher</span>
      <div class="seg-wide">${[['date', "Date d'ajout"], ['likes', 'Likes'], ['priority', 'Priorité']].map(([v, l]) => `<button type="button" class="${STATE.sort === v ? 'active' : ''}" data-f-sort="${v}">${l}</button>`).join('')}</div>
      <div class="seg-wide">${[['grid', 'Grille'], ['list', 'Liste']].map(([v, l]) => `<button type="button" class="${STATE.view === v ? 'active' : ''}" data-f-view="${v}">${l}</button>`).join('')}</div>
    </div>
    ${node && node.subs.length ? `<div class="field">
      <span class="field-label">Dossier ${escapeHtml(node.name)}</span>
      <div class="choice-row"><button type="button" class="choice${!STATE.sub ? ' on' : ''}" data-f-sub="">Tout ${escapeHtml(node.name)}</button>${node.subs.map(([s]) => `<button type="button" class="choice${STATE.sub === s ? ' on' : ''}" data-f-sub="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}</div>
    </div>` : ''}`;
  $('#applyFiltersBtn').textContent = `Voir ${filteredLinks().length} lien${filteredLinks().length > 1 ? 's' : ''}`;
}
$('#mFilterBtn').onclick = () => { renderFilterSheet(); openOverlay('#filterOverlay'); };
$('#filterOverlay').addEventListener('click', (e) => {
  const p = e.target.closest('[data-f-prio]');
  if(p){ STATE.priorityFilter = STATE.priorityFilter === p.dataset.fPrio ? 'toutes' : p.dataset.fPrio; }
  else if(e.target.closest('[data-f-fav]')){ STATE.nav = STATE.nav === 'fav' ? 'all' : 'fav'; if(STATE.nav === 'fav'){ STATE.folder = ''; STATE.sub = ''; } }
  else if(e.target.closest('[data-f-sort]')){ STATE.sort = e.target.closest('[data-f-sort]').dataset.fSort; }
  else if(e.target.closest('[data-f-view]')){ STATE.view = e.target.closest('[data-f-view]').dataset.fView; }
  else if(e.target.closest('[data-f-sub]')){ STATE.sub = e.target.closest('[data-f-sub]').dataset.fSub; }
  else return;
  render();
  renderFilterSheet();
});
$('#clearFiltersBtn').onclick = () => {
  STATE.priorityFilter = 'toutes'; STATE.sort = 'date'; STATE.sub = '';
  if(STATE.nav === 'fav') STATE.nav = 'all';
  render(); renderFilterSheet();
};
$('#applyFiltersBtn').onclick = () => closeOverlay('#filterOverlay');

/* ---------- Init ---------- */
// Crossing the phone/desktop width only changes the layout, which CSS
// handles: the cards (and any video playing in them) are kept as they are.
// Going full screen on a video also changes the width, so nothing is
// re-rendered while something is full screen.
window.matchMedia('(max-width: 760px)').addEventListener('change', () => {
  if(document.fullscreenElement || document.webkitFullscreenElement) return;
  syncControls();
});
STATE.search = '';
$('#searchInput').value = '';
restoreUIState();
loadFromGitHub();

})();
</script>
